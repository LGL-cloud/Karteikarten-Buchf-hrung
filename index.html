<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karteikarten Kontenlehre</title>
    <style>
:root {
  color-scheme: light;
  --bg: #eef3f7;
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #687684;
  --line: #d7e0e8;
  --brand: #16625f;
  --brand-dark: #0d4544;
  --accent: #f0b44c;
  --good: #18794e;
  --bad: #b42318;
  --shadow: 0 20px 45px rgba(23, 33, 43, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #f8fbfd 0%, var(--bg) 100%);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

.app {
  width: min(980px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0;
}

.workspace {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 26px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-start;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--brand);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.15;
}

h1 {
  font-size: clamp(2rem, 4vw, 3.4rem);
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(3, 76px);
  gap: 8px;
}

.scoreboard div {
  min-height: 68px;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  place-items: center;
  padding: 8px;
  background: #f9fbfc;
}

.scoreboard span {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--brand-dark);
}

.scoreboard small {
  color: var(--muted);
}

.mode-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 26px 0 18px;
}

.mode-button,
.secondary {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.mode-button {
  flex: 0 1 auto;
}

.mode-button.is-active,
.primary {
  border: 1px solid var(--brand);
  border-radius: 8px;
  background: var(--brand);
  color: #fff;
  font-weight: 800;
}

.quiz-panel {
  border-top: 1px solid var(--line);
  padding-top: 22px;
}

.question-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 12px;
}

.flashcard {
  width: 100%;
  min-height: 230px;
  padding: 28px;
  text-align: left;
  background: #123f3f;
  color: #fff;
  border: 0;
  border-radius: 8px;
  display: grid;
  align-content: center;
  gap: 14px;
}

.flashcard.is-flipped {
  background: #2f4a68;
}

.card-label {
  color: var(--accent);
  font-weight: 800;
  text-transform: uppercase;
  font-size: 0.8rem;
}

.flashcard strong {
  font-size: clamp(1.45rem, 3vw, 2.35rem);
  line-height: 1.18;
}

.hint {
  color: #d8e5e3;
  line-height: 1.45;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.answer {
  min-height: 76px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  text-align: left;
  padding: 14px 16px;
  line-height: 1.35;
  font-weight: 700;
}

.answer:hover,
.answer:focus-visible {
  border-color: var(--brand);
}

.answer.is-correct {
  border-color: var(--good);
  background: #eef8f2;
}

.answer.is-wrong {
  border-color: var(--bad);
  background: #fff1f0;
}

.answer:disabled {
  cursor: default;
}

.feedback {
  margin-top: 16px;
  border-left: 5px solid var(--brand);
  background: #f7fafb;
  padding: 14px 16px;
  line-height: 1.5;
}

.feedback.good {
  border-left-color: var(--good);
}

.feedback.bad {
  border-left-color: var(--bad);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.primary,
.secondary {
  min-height: 44px;
  padding: 0 16px;
}

.app-footer {
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1.4;
  text-align: center;
}

@media (max-width: 900px) {
  .topbar {
    flex-direction: column;
  }

  .scoreboard {
    width: 100%;
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 620px) {
  .app {
    width: 100%;
    padding: 0;
  }

  .workspace {
    min-height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    padding: 16px 14px 20px;
  }

  h1 {
    font-size: 1.85rem;
  }

  .eyebrow {
    font-size: 0.72rem;
  }

  .scoreboard {
    gap: 6px;
  }

  .scoreboard div {
    min-height: 58px;
    padding: 6px 4px;
  }

  .scoreboard span {
    font-size: 1.2rem;
  }

  .scoreboard small {
    font-size: 0.75rem;
  }

  .mode-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 18px 0 14px;
  }

  .mode-button {
    width: 100%;
    min-height: 46px;
    padding: 0 8px;
    text-align: center;
  }

  .answers {
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 14px;
  }

  .flashcard {
    min-height: 190px;
    padding: 18px;
  }

  .flashcard strong {
    font-size: 1.35rem;
  }

  .answer {
    min-height: 58px;
    padding: 12px 14px;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .primary,
  .secondary {
    width: 100%;
    min-height: 48px;
  }

  .question-meta {
    font-size: 0.9rem;
  }

  .feedback {
    padding: 12px 14px;
  }
}

@media (max-width: 380px) {
  .mode-row {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 1.6rem;
  }

  .flashcard strong {
    font-size: 1.22rem;
  }
}

    </style>
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Rechnungswesen ueben</p>
            <h1 id="app-title">Karteikarten: Kontenarten</h1>
          </div>
          <div class="scoreboard" aria-label="Lernstand">
            <div>
              <span id="score-correct">0</span>
              <small>richtig</small>
            </div>
            <div>
              <span id="score-total">0</span>
              <small>bearbeitet</small>
            </div>
            <div>
              <span id="score-streak">0</span>
              <small>Serie</small>
            </div>
          </div>
        </div>

        <div class="mode-row" aria-label="Quizmodus">
          <button class="mode-button is-active" type="button" data-mode="all">Alle Fragen</button>
          <button class="mode-button" type="button" data-mode="bestand">Bestandskonten</button>
          <button class="mode-button" type="button" data-mode="erfolg">Erfolgskonten</button>
          <button class="mode-button" type="button" data-mode="zuordnung">Zuordnungen</button>
          <button class="mode-button" type="button" data-mode="wrong">Fehler wiederholen</button>
        </div>

        <section class="quiz-panel" aria-live="polite">
          <div class="question-meta">
            <span id="question-tag">Kontenart</span>
            <span id="question-count">Frage 1</span>
          </div>

          <button id="card" class="flashcard" type="button" aria-label="Karte umdrehen">
            <span class="card-label">Frage</span>
            <strong id="question-text"></strong>
            <span id="question-hint" class="hint"></span>
          </button>

          <div id="answers" class="answers" aria-label="Antwortmoeglichkeiten"></div>

          <div id="feedback" class="feedback" hidden></div>

          <div class="actions">
            <button id="next-button" class="primary" type="button">Naechste Frage</button>
            <button id="shuffle-button" class="secondary" type="button">Mischen</button>
            <button id="reset-button" class="secondary" type="button">Lernstand zuruecksetzen</button>
          </div>
        </section>
      </section>
    </main>

    tag: "Ertrag",
    question: "Was sind Umsatzerloese fuer ein Konto?",
    answers: ["Ertragskonto", "Aufwandskonto", "Aktives Bestandskonto", "Passives Bestandskonto"],
    correct: 0,
    explanation: "Umsatzerloese entstehen durch Verkauf und sind Ertraege."
  }
];

const wrongKey = "konten-karteikarten-fehler-v1";

const state = {
  questions: [...defaultQuestions],
  currentMode: "all",
  currentIndex: 0,
  score: { correct: 0, total: 0, streak: 0 },
  answered: false,
  currentAnswers: [],
  wrongIds: loadWrongIds()
};

const elements = {
  card: document.querySelector("#card"),
  questionText: document.querySelector("#question-text"),
  questionHint: document.querySelector("#question-hint"),
  questionTag: document.querySelector("#question-tag"),
  questionCount: document.querySelector("#question-count"),
  answers: document.querySelector("#answers"),
  feedback: document.querySelector("#feedback"),
  nextButton: document.querySelector("#next-button"),
  shuffleButton: document.querySelector("#shuffle-button"),
  resetButton: document.querySelector("#reset-button"),
  scoreCorrect: document.querySelector("#score-correct"),
  scoreTotal: document.querySelector("#score-total"),
  scoreStreak: document.querySelector("#score-streak"),
  modeButtons: document.querySelectorAll(".mode-button")
};

function loadWrongIds() {
  try {
    return new Set(JSON.parse(localStorage.getItem(wrongKey)) || []);
  } catch {
    return new Set();
  }
}

function saveWrongIds() {
  localStorage.setItem(wrongKey, JSON.stringify([...state.wrongIds]));
}

function getActiveQuestions() {
  if (state.currentMode === "wrong") {
    return state.questions.filter((question) => state.wrongIds.has(question.id));
  }

  if (state.currentMode === "all") return state.questions;

  return state.questions.filter((question) => question.category === state.currentMode);
}

function getCurrentQuestion() {
  const questions = getActiveQuestions();
  if (!questions.length) return null;
  return questions[state.currentIndex % questions.length];
}

function renderQuestion() {
  const questions = getActiveQuestions();
  const question = getCurrentQuestion();
  state.answered = false;

  elements.answers.innerHTML = "";
  elements.feedback.hidden = true;
  elements.feedback.className = "feedback";
  elements.card.classList.remove("is-flipped");

  if (!question) {
    elements.questionTag.textContent = "Keine Fragen";
    elements.questionCount.textContent = "0 Fragen";
    elements.questionText.textContent = state.currentMode === "wrong"
      ? "Noch keine Fehler gespeichert."
      : "In diesem Bereich gibt es noch keine Fragen.";
    elements.questionHint.textContent = "Waehle einen anderen Modus oder mache erst ein paar Aufgaben.";
    return;
  }

  elements.questionTag.textContent = question.tag || categoryLabel(question.category);
  elements.questionCount.textContent = `Frage ${(state.currentIndex % questions.length) + 1} von ${questions.length}`;
  elements.questionText.textContent = question.question;
  elements.questionHint.textContent = "Waehle die passende Antwort aus. Klick auf die Karte fuer einen Tipp.";

  state.currentAnswers = shuffleAnswers(question);

  state.currentAnswers.forEach((answerOption, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.type = "button";
    button.textContent = `${String.fromCharCode(65 + index)}. ${answerOption.text}`;
    button.addEventListener("click", () => checkAnswer(index));
    elements.answers.append(button);
  });

  renderScores();
}

function checkAnswer(selectedIndex) {
  if (state.answered) return;

  const question = getCurrentQuestion();
  if (!question) return;

  state.answered = true;
  const isCorrect = state.currentAnswers[selectedIndex]?.isCorrect === true;
  state.score.total += 1;

  if (isCorrect) {
    state.score.correct += 1;
    state.score.streak += 1;
    state.wrongIds.delete(question.id);
  } else {
    state.score.streak = 0;
    state.wrongIds.add(question.id);
  }

  saveWrongIds();

  [...elements.answers.children].forEach((button, index) => {
    button.disabled = true;
    if (state.currentAnswers[index]?.isCorrect) button.classList.add("is-correct");
    if (index === selectedIndex && !isCorrect) button.classList.add("is-wrong");
  });

  elements.feedback.hidden = false;
  elements.feedback.classList.add(isCorrect ? "good" : "bad");
  elements.feedback.innerHTML = `<strong>${isCorrect ? "Richtig." : "Noch nicht."}</strong> ${question.explanation}`;
  renderScores();
}

function shuffleAnswers(question) {
  const answers = question.answers.map((text, index) => ({
    text,
    isCorrect: index === question.correct
  }));

  for (let i = answers.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [answers[i], answers[j]] = [answers[j], answers[i]];
  }

  return answers;
}

function renderScores() {
  elements.scoreCorrect.textContent = state.score.correct;
  elements.scoreTotal.textContent = state.score.total;
  elements.scoreStreak.textContent = state.score.streak;
}

function nextQuestion() {
  const questions = getActiveQuestions();
  if (!questions.length) {
    renderQuestion();
    return;
  }

  state.currentIndex = (state.currentIndex + 1) % questions.length;
  renderQuestion();
}

function shuffleQuestions() {
  const shuffled = [...state.questions];
  for (let i = shuffled.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  state.questions = shuffled;
  state.currentIndex = 0;
  renderQuestion();
}

function resetProgress() {
  state.score = { correct: 0, total: 0, streak: 0 };
  state.wrongIds.clear();
  saveWrongIds();
  renderScores();
  renderQuestion();
}

function setMode(mode) {
  state.currentMode = mode;
  state.currentIndex = 0;
  elements.modeButtons.forEach((button) => {
    button.classList.toggle("is-active", button.dataset.mode === mode);
  });
  renderQuestion();
}

function categoryLabel(category) {
  if (category === "erfolg") return "Erfolgskonten";
  if (category === "zuordnung") return "Zuordnungen";
  return "Bestandskonten";
}

elements.nextButton.addEventListener("click", nextQuestion);
elements.shuffleButton.addEventListener("click", shuffleQuestions);
elements.resetButton.addEventListener("click", resetProgress);
elements.card.addEventListener("click", () => {
  const question = getCurrentQuestion();
  if (!question) return;
  elements.card.classList.toggle("is-flipped");
  elements.questionHint.textContent = elements.card.classList.contains("is-flipped")
    ? "Tipp: Bestandskonten werden ueber das Schlussbilanzkonto abgeschlossen. Erfolgskonten ueber GuV."
    : "Waehle die passende Antwort aus. Klick auf die Karte fuer einen Tipp.";
});
elements.modeButtons.forEach((button) => {
  button.addEventListener("click", () => setMode(button.dataset.mode));
});

renderQuestion();

    </script>
  </body>
</html>
